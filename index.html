<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXPLAY TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{background:#111522;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:25px;font-weight:bold;color:#38a5ff}
nav{display:flex;gap:15px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:7px;padding:11px 15px;background:#202a3d;color:white}
button:hover{background:#1478d4}
nav button{background:transparent}
main{padding:20px;max-width:1200px;margin:auto}
.hero{padding:35px 20px;background:linear-gradient(110deg,#142b52,#111522);border-radius:14px;margin-bottom:30px}
.hero h1{font-size:34px;margin-bottom:8px}
h2{margin-top:30px}
.search{width:100%;padding:14px;background:#171e2c;border:1px solid #30394b;color:white;border-radius:8px;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:15px}
.card{background:#151b29;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover;background:#222}
.card h3{font-size:14px;padding:0 10px}
.card p{font-size:12px;color:#aaa;padding:0 10px 10px}
.card:hover{outline:2px solid #38a5ff}
#details{display:none;background:#151b29;padding:20px;border-radius:12px;margin-top:20px}
#details img{width:160px;max-width:100%;border-radius:8px}
footer{text-align:center;padding:30px;color:#888}
</style>
</head>
<body>
<header>
<div class="logo">MAXPLAY TV</div>
<nav>
<button onclick="home()">Início</button>
<button onclick="showCategory('Filmes')">Filmes</button>
<button onclick="showCategory('Séries')">Séries</button>
<button onclick="showCategory('Canais')">Canais</button>
<button onclick="showCategory('Esportes')">Esportes</button>
</nav>
</header>

<main>
<section class="hero">
<h1>Seu entretenimento começa aqui.</h1>
<p>Explore filmes, séries e muito mais na MAXPLAY TV.</p>
</section>

<input class="search" id="search" placeholder="Pesquisar filmes e séries..." oninput="searchItems()">

<h2 id="heading">Destaques</h2>
<div class="grid" id="catalog"></div>

<section id="details">
<button onclick="home()">← Voltar</button>
<h2 id="detailTitle"></h2>
<img id="detailImage" alt="Capa do conteúdo">
<p id="detailDescription"></p>
<p id="detailInfo"></p>
</section>
</main>

<footer>MAXPLAY TV © 2026</footer>

<script>
const items=[
["Interestelar","Filmes","Ficção científica","Uma jornada espacial em busca de um novo lar.","https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"],
["Batman","Filmes","Ação","Um herói enfrenta o crime em Gotham.","https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"],
["A Origem","Filmes","Ficção científica","Uma missão dentro do mundo dos sonhos.","https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"],
["Toy Story","Filmes","Animação","Uma aventura entre brinquedos que ganham vida.","https://image.tmdb.org/t/p/w500/uXDfjJbdP4ijW5hWSBrPrlKpxab.jpg"],
["Coringa","Filmes","Drama","A história de um homem em Gotham.","https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"],
["Vingadores","Filmes","Ação","Heróis se unem para proteger o mundo.","https://image.tmdb.org/t/p/w500/RYMX2wcKCBAr24UyPD7xwmjaTn.jpg"],
["Avatar","Filmes","Aventura","Uma aventura em um mundo extraordinário.","https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg"],
["Homem-Aranha","Filmes","Ação","Um jovem herói protege sua cidade.","https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg"],
["Stranger Things","Séries","Suspense","Mistérios acontecem em uma pequena cidade.","https://image.tmdb.org/t/p/w500/x2LSRK2Cm7MZhjluni1msVJ3wDF.jpg"],
["Breaking Bad","Séries","Drama","Um professor enfrenta grandes mudanças.","https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg"],
["Wandinha","Séries","Mistério","Uma estudante investiga acontecimentos estranhos.","https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg"],
["The Last of Us","Séries","Drama","Uma jornada em um mundo transformado.","https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg"]
];

function render(list){
const catalog=document.getElementById("catalog");
catalog.innerHTML="";
list.forEach(item=>{
const card=document.createElement("article");
card.className="card";
card.innerHTML=`<img src="${item[4]}" alt="${item[0]}" loading="lazy"><h3>${item[0]}</h3><p>${item[1]} • ${item[2]}</p>`;
card.onclick=()=>details(item);
catalog.appendChild(card);
});
}
function details(item){
document.getElementById("details").style.display="block";
document.getElementById("detailTitle").textContent=item[0];
document.getElementById("detailImage").src=item[4];
document.getElementById("detailDescription").textContent=item[3];
document.getElementById("detailInfo").textContent=item[1]+" • "+item[2];
document.getElementById("heading").textContent="Detalhes";
document.getElementById("catalog").style.display="none";
}
function showCategory(category){
document.getElementById("details").style.display="none";
document.getElementById("catalog").style.display="grid";
document.getElementById("heading").textContent=category;
if(category==="Filmes"||category==="Séries"){
render(items.filter(x=>x[1]===category));
}else{
render([]);
document.getElementById("catalog").innerHTML="<p>Em breve: catálogo desta seção.</p>";
}
}
function home(){
document.getElementById("details").style.display="none";
document.getElementById("catalog").style.display="grid";
document.getElementById("heading").textContent="Destaques";
document.getElementById("search").value="";
render(items);
}
function searchItems(){
const term=document.getElementById("search").value.toLowerCase();
document.getElementById("details").style.display="none";
document.getElementById("catalog").style.display="grid";
document.getElementById("heading").textContent="Resultados da pesquisa";
render(items.filter(x=>x[0].toLowerCase().includes(term)));
}
render(items);
</script>
</body>
  </html>
